<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc">
  <title id="title">From telemetry to evidence</title>
  <desc id="desc">Your Grafana metrics, traces and logs flow through Decant into an evidence report. Optional AI plans the investigation and explains the evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#8aa6ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="480" height="700" rx="20" fill="#13252c"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="49" font-size="25" font-weight="600" fill="#f0f7f5">Why is checkout slower?</text>
    <rect x="28" y="80" width="424" height="134" rx="12" fill="#1b3038" stroke="#35515a"/>
    <text x="50" y="121" font-size="25" font-weight="700" fill="#f0f7f5">Your Grafana</text>
    <text x="50" y="156" font-size="21" fill="#b9cdd1">Prometheus / Mimir</text>
    <text x="50" y="187" font-size="21" fill="#b9cdd1">Tempo · Loki</text>
    <path d="M240 222v25" fill="none" stroke="#8aa6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="28" y="258" width="424" height="134" rx="12" fill="#aff0d5"/>
    <text x="50" y="299" font-size="25" font-weight="700" fill="#13252c">Decant</text>
    <text x="50" y="334" font-size="21" fill="#244e43">Compare time windows</text>
    <text x="50" y="365" font-size="21" fill="#244e43">Select and save evidence</text>
    <path d="M240 400v25" fill="none" stroke="#8aa6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="28" y="436" width="424" height="134" rx="12" fill="#1b3038" stroke="#35515a"/>
    <text x="50" y="477" font-size="25" font-weight="700" fill="#f0f7f5">Evidence report</text>
    <text x="50" y="512" font-size="21" fill="#b9cdd1">Changes and references</text>
    <text x="50" y="543" font-size="21" fill="#b9cdd1">Missing checks and gaps</text>
    <text x="28" y="613" font-size="17" font-weight="700" fill="#aff0d5">OPTIONAL AI</text>
    <text x="28" y="645" font-size="20" fill="#b9cdd1">Plan the investigation → Explain the evidence</text>
    <text x="28" y="678" font-size="17" fill="#a9c0c5">Read-only · Local replay</text>
  </g>
</svg>
