<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">From telemetry to evidence</title>
  <desc id="desc">Decant queries your Grafana metrics, traces and logs, compares time windows and saves a report containing changes, evidence references and gaps. Optional AI plans the investigation and explains the evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#8aa6ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1040" height="360" rx="20" fill="#13252c"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="58" font-size="26" font-weight="600" fill="#f0f7f5">Why is checkout slower?</text>
    <text x="44" y="87" font-size="16" fill="#a9c0c5">Investigate your existing telemetry. Revisit the evidence offline.</text>
    <rect x="44" y="120" width="280" height="138" rx="12" fill="#1b3038" stroke="#35515a"/>
    <rect x="380" y="120" width="280" height="138" rx="12" fill="#aff0d5"/>
    <rect x="716" y="120" width="280" height="138" rx="12" fill="#1b3038" stroke="#35515a"/>
    <path d="M336 189h29" fill="none" stroke="#8aa6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M672 189h29" fill="none" stroke="#8aa6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="66" y="159" font-size="22" font-weight="700" fill="#f0f7f5">Your Grafana</text>
    <text x="66" y="192" font-size="17" fill="#b9cdd1">Prometheus / Mimir</text>
    <text x="66" y="222" font-size="17" fill="#b9cdd1">Tempo · Loki</text>
    <text x="402" y="159" font-size="22" font-weight="700" fill="#13252c">Decant</text>
    <text x="402" y="192" font-size="17" fill="#244e43">Compare time windows</text>
    <text x="402" y="222" font-size="17" fill="#244e43">Select and save evidence</text>
    <text x="738" y="159" font-size="22" font-weight="700" fill="#f0f7f5">Evidence report</text>
    <text x="738" y="192" font-size="17" fill="#b9cdd1">Changes and references</text>
    <text x="738" y="222" font-size="17" fill="#b9cdd1">Missing checks and gaps</text>
    <path d="M44 287h952" stroke="#35515a"/>
    <text x="44" y="322" font-size="16" fill="#aff0d5" font-weight="700">OPTIONAL AI</text>
    <text x="182" y="322" font-size="17" fill="#b9cdd1">Plan the investigation</text>
    <path d="M362 316h32" fill="none" stroke="#8aa6ac" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="412" y="322" font-size="17" fill="#b9cdd1">Explain the evidence</text>
    <text x="996" y="322" text-anchor="end" font-size="16" fill="#a9c0c5">Read-only · Local replay</text>
  </g>
</svg>
