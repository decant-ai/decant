[workspace]
members = [
    "crates/decant-backend",
    "crates/decant-cli",
    "crates/decant-compiler",
    "crates/decant-fixtures",
    "crates/decant-ingest",
    "crates/decant-ir",
    "crates/decant-jsonl",
    "crates/decant-kafka",
    "crates/decant-kafka-client",
    "crates/decant-kafka-live",
    "crates/decant-mcp",
    "crates/decant-otlp-adapter",
    "crates/decant-otlp-ingest",
    "crates/decant-otlp-json",
    "crates/decant-runtime",
    "crates/decant-state",
    "crates/decant-storage",
]
resolver = "3"

[workspace.package]
license = "AGPL-3.0-only"
edition = "2024"
publish = false
rust-version = "1.98"
