[package]
name = "decant-compiler"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
decant-ir = { path = "../decant-ir" }
decant-state = { path = "../decant-state" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
decant-fixtures = { path = "../decant-fixtures" }
