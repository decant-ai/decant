[package]
name = "decant-backend"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "native-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
native-tls = { version = "=0.2.18", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "time", "net", "io-util"] }
